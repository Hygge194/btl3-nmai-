<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="860" height="660" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ACTIVITY DIAGRAM: LUỒNG THỰC THI HỆ THỐNG (THỰC NGHIỆM ĐỐI CHỨNG)</text>

  <!-- Start Node -->
  <circle cx="430" cy="54" r="11" fill="#0f172a"/>
  <line x1="430" y1="65" x2="430" y2="85" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <rect x="60" y="87" width="740" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="78" y="108" font-size="12.5" font-weight="700" fill="#1e40af">Giai đoạn 1: Chuẩn bị cấu hình &amp; Dữ liệu (main.py / data_generator.py / data_loader.py)</text>

  <rect x="85" y="122" width="205" height="64" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="187" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Tiếp nhận tham số</text>
  <text x="187" y="161" text-anchor="middle" font-size="10.5" fill="#475569">config.py &amp; CLI (--seed,</text>
  <text x="187" y="176" text-anchor="middle" font-size="10.5" fill="#475569">--pop-size, --generations)</text>

  <line x1="290" y1="154" x2="326" y2="154" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="328" y="122" width="225" height="64" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="440" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Sinh &amp; kiểm tra tài nguyên</text>
  <text x="440" y="161" text-anchor="middle" font-size="10.5" fill="#475569">Kiểm tra tích lũy kích thước phòng</text>
  <text x="440" y="176" text-anchor="middle" font-size="10.5" fill="#475569">&amp; lưu data/*.json</text>

  <line x1="553" y1="154" x2="588" y2="154" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="122" width="190" height="64" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="685" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Nạp đối tượng Domain</text>
  <text x="685" y="161" text-anchor="middle" font-size="10.5" fill="#475569">Course, Section, Prof, Room</text>
  <text x="685" y="176" text-anchor="middle" font-size="10.5" fill="#475569">&amp; mảng chỉ số NumPy</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="430" y1="205" x2="430" y2="233" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="60" y="235" width="740" height="125" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="78" y="256" font-size="12.5" font-weight="700" fill="#991b1b">Giai đoạn 2: Điều phối thực nghiệm đối chứng (SchedulerService &amp; GA Engine)</text>

  <rect x="95" y="272" width="195" height="68" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <text x="192" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">1. Baseline GA</text>
  <text x="192" y="312" text-anchor="middle" font-size="10.5" fill="#475569">Random Init + Uniform</text>
  <text x="192" y="327" text-anchor="middle" font-size="10.5" fill="#475569">Crossover (Không Repair)</text>

  <line x1="290" y1="306" x2="331" y2="306" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="333" y="272" width="195" height="68" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">2. Improved GA</text>
  <text x="430" y="312" text-anchor="middle" font-size="10.5" fill="#475569">Greedy Init + Course-Block</text>
  <text x="430" y="327" text-anchor="middle" font-size="10.5" fill="#475569">Crossover (Không Repair)</text>

  <line x1="528" y1="306" x2="569" y2="306" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="571" y="272" width="205" height="68" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <text x="673" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">3. Proposed GA</text>
  <text x="673" y="312" text-anchor="middle" font-size="10.5" fill="#475569">Greedy Init + Block Cross</text>
  <text x="673" y="327" text-anchor="middle" font-size="10.5" fill="#475569">+ Repair 4 Pha + Elitism</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="430" y1="360" x2="430" y2="388" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="60" y="390" width="740" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="78" y="411" font-size="12.5" font-weight="700" fill="#166534">Giai đoạn 3: Đánh giá và lựa chọn nghiệm tốt nhất (ExperimentBundle)</text>

  <rect x="115" y="422" width="280" height="46" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.3"/>
  <text x="255" y="442" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Xếp hạng theo R(x) = (H(x), P(x))</text>
  <text x="255" y="458" text-anchor="middle" font-size="10.5" fill="#475569">Ưu tiên nghiệm khả thi có tổng phạt thấp nhất</text>

  <line x1="395" y1="445" x2="463" y2="445" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="465" y="422" width="280" height="46" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.3"/>
  <text x="605" y="442" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Xác nhận trạng thái khả thi (H(x) == 0)</text>
  <text x="605" y="458" text-anchor="middle" font-size="10.5" fill="#475569">Đóng gói kết quả &amp; lịch sử hội tụ</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="430" y1="482" x2="430" y2="510" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="60" y="512" width="740" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="78" y="533" font-size="12.5" font-weight="700" fill="#5b21b6">Giai đoạn 4: Thống kê, xuất dữ liệu và trực quan hóa (src/utils/ → outputs/)</text>

  <rect x="95" y="545" width="315" height="48" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="252" y="565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Xuất dữ liệu &amp; báo cáo (exporter.py)</text>
  <text x="252" y="582" text-anchor="middle" font-size="10.5" fill="#475569">best_schedule.csv, conflict_report.json, HTML</text>

  <rect x="450" y="545" width="315" height="48" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="607" y="565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Vẽ biểu đồ 300 DPI (visualization.py)</text>
  <text x="607" y="582" text-anchor="middle" font-size="10.5" fill="#475569">fitness_plot.png, heatmap, sensitivity, breakdown</text>

  <!-- End Node -->
  <line x1="430" y1="608" x2="430" y2="626" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="430" cy="640" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="430" cy="640" r="6" fill="#0f172a"/>
</svg>