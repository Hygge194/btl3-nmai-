<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="diamond-filled" viewBox="0 0 14 10" refX="0" refY="5" markerWidth="11" markerHeight="8" orient="auto">
      <path d="M 0 5 L 7 1 L 14 5 L 7 9 z" fill="#1e293b"/>
    </marker>
    <marker id="diamond-open" viewBox="0 0 14 10" refX="0" refY="5" markerWidth="11" markerHeight="8" orient="auto">
      <path d="M 0 5 L 7 1 L 14 5 L 7 9 z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CLASS DIAGRAM: CẤU TRÚC NGHIỆM GA VÀ MÔ HÌNH DỮ LIỆU DOMAIN</text>

  <!-- Group Backgrounds -->
  <rect x="24" y="45" width="912" height="295" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="40" y="66" font-size="12.5" font-weight="700" fill="#0369a1">Nhóm biểu diễn nghiệm ứng viên (Candidate Solution Structures)</text>

  <rect x="24" y="365" width="912" height="275" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="40" y="386" font-size="12.5" font-weight="700" fill="#334155">Nhóm mô hình dữ liệu bài toán (Problem Data Models – tham chiếu qua ID)</text>

  <!-- 1. Population -->
  <rect x="40" y="85" width="195" height="175" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="40" y="85" width="195" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="137" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Population</text>
  <line x1="40" y1="158" x2="235" y2="158" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="130" font-size="11" fill="#1e293b">+ chromosomes: List[Chromosome]</text>
  <text x="50" y="146" font-size="11" fill="#1e293b">+ generation: int</text>
  <text x="50" y="176" font-size="11" fill="#0f172a">+ sort_by_quality(): None</text>
  <text x="50" y="193" font-size="11" fill="#0f172a">+ best(): Chromosome</text>
  <text x="50" y="210" font-size="11" fill="#0f172a">+ get_elites(n): List[Chromosome]</text>
  <text x="50" y="227" font-size="11" fill="#0f172a">+ average_fitness(): float</text>
  <text x="50" y="244" font-size="11" fill="#0f172a">+ __len__(): int</text>

  <!-- 2. Chromosome -->
  <rect x="285" y="85" width="215" height="220" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="285" y="85" width="215" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="392" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Chromosome</text>
  <line x1="285" y1="230" x2="500" y2="230" stroke="#cbd5e1" stroke-width="1"/>
  <text x="295" y="130" font-size="11" fill="#1e293b">+ genes: List[Gene]</text>
  <text x="295" y="146" font-size="11" fill="#1e293b">+ fitness: float</text>
  <text x="295" y="162" font-size="11" fill="#1e293b">+ hard_violations: int</text>
  <text x="295" y="178" font-size="11" fill="#1e293b">+ soft_penalty: float</text>
  <text x="295" y="194" font-size="11" fill="#1e293b">+ bonus_penalty: float</text>
  <text x="295" y="210" font-size="11" fill="#1e293b">+ total_penalty: float</text>
  <text x="295" y="224" font-size="10.5" fill="#1e293b">+ breakdown: Dict[str, int]</text>
  <text x="295" y="248" font-size="11" fill="#0f172a">+ copy(): Chromosome</text>
  <text x="295" y="266" font-size="11" fill="#0f172a">+ rank_key(): (int, float)</text>
  <text x="295" y="284" font-size="11" fill="#0f172a">+ is_better_than(other): bool</text>

  <!-- 3. Gene -->
  <rect x="555" y="85" width="175" height="150" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="555" y="85" width="175" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="642" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Gene</text>
  <line x1="555" y1="186" x2="730" y2="186" stroke="#cbd5e1" stroke-width="1"/>
  <text x="565" y="130" font-size="11" fill="#1e293b">+ section_id: int</text>
  <text x="565" y="146" font-size="11" fill="#1e293b">+ professor_id: int</text>
  <text x="565" y="162" font-size="11" fill="#1e293b">+ session_1: Session</text>
  <text x="565" y="178" font-size="11" fill="#1e293b">+ session_2: Session</text>
  <text x="565" y="208" font-size="11" fill="#0f172a">+ copy(): Gene</text>

  <!-- 4. Session -->
  <rect x="775" y="85" width="145" height="140" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="775" y="85" width="145" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="847" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Session</text>
  <line x1="775" y1="175" x2="920" y2="175" stroke="#cbd5e1" stroke-width="1"/>
  <text x="785" y="130" font-size="11" fill="#1e293b">+ day: int (0..4)</text>
  <text x="785" y="146" font-size="11" fill="#1e293b">+ timeslot: int (0..5)</text>
  <text x="785" y="162" font-size="11" fill="#1e293b">+ room_id: int (0..34)</text>
  <text x="785" y="198" font-size="11" fill="#0f172a">+ copy(): Session</text>

  <!-- Relationships Top Row -->
  <!-- Population -> Chromosome -->
  <line x1="235" y1="150" x2="283" y2="150" stroke="#1e293b" stroke-width="1.6" marker-start="url(#diamond-open)" marker-end="url(#arrow)"/>
  <text x="260" y="142" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">80</text>

  <!-- Chromosome -> Gene -->
  <line x1="500" y1="150" x2="553" y2="150" stroke="#1e293b" stroke-width="1.6" marker-start="url(#diamond-open)" marker-end="url(#arrow)"/>
  <text x="527" y="142" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">480</text>

  <!-- Gene -> Session -->
  <line x1="730" y1="150" x2="773" y2="150" stroke="#1e293b" stroke-width="1.6" marker-start="url(#diamond-filled)" marker-end="url(#arrow)"/>
  <text x="754" y="142" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">2</text>

  <!-- 5. Course -->
  <rect x="45" y="425" width="160" height="115" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="45" y="425" width="160" height="28" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="125" y="444" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Course</text>
  <text x="55" y="472" font-size="11" fill="#1e293b">+ id: int (0..59)</text>
  <text x="55" y="490" font-size="11" fill="#1e293b">+ code: str</text>
  <text x="55" y="508" font-size="11" fill="#1e293b">+ name: str</text>

  <!-- 6. Section -->
  <rect x="255" y="425" width="185" height="130" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="255" y="425" width="185" height="28" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="347" y="444" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Section</text>
  <text x="265" y="472" font-size="11" fill="#1e293b">+ id: int (0..479)</text>
  <text x="265" y="490" font-size="11" fill="#1e293b">+ code: str</text>
  <text x="265" y="508" font-size="11" fill="#1e293b">+ course_id: int</text>
  <text x="265" y="526" font-size="11" fill="#1e293b">+ registration_size: int</text>

  <!-- 7. Professor -->
  <rect x="485" y="425" width="210" height="165" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="485" y="425" width="210" height="28" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="590" y="444" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Professor</text>
  <text x="495" y="472" font-size="11" fill="#1e293b">+ id: int (0..59)</text>
  <text x="495" y="490" font-size="11" fill="#1e293b">+ code: str</text>
  <text x="495" y="508" font-size="11" fill="#1e293b">+ name: str</text>
  <text x="495" y="526" font-size="11" fill="#1e293b">+ eligible_courses: List[int]</text>
  <text x="495" y="544" font-size="11" fill="#1e293b">+ favorite_courses: List[int]</text>
  <text x="495" y="562" font-size="11" fill="#1e293b">+ max_sessions: int = 20</text>

  <!-- 8. Room -->
  <rect x="735" y="425" width="185" height="165" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="735" y="425" width="185" height="28" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="827" y="444" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Room</text>
  <line x1="735" y1="538" x2="920" y2="538" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745" y="472" font-size="11" fill="#1e293b">+ id: int (0..34)</text>
  <text x="745" y="490" font-size="11" fill="#1e293b">+ code: str</text>
  <text x="745" y="508" font-size="11" fill="#1e293b">+ size: int (0, 1, 2)</text>
  <text x="745" y="526" font-size="11" fill="#1e293b">+ availability: bool[5][6]</text>
  <text x="745" y="560" font-size="11" fill="#0f172a">+ is_available(d, t): bool</text>

  <!-- Associations -->
  <!-- Section -> Course -->
  <line x1="255" y1="485" x2="207" y2="485" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="231" y="476" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">8 : 1</text>

  <!-- Gene -> Section -->
  <path d="M 600 235 L 600 325 L 347 325 L 347 423" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="470" y="318" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">section_id (1 : 1)</text>

  <!-- Gene -> Professor -->
  <line x1="642" y1="235" x2="642" y2="423" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="692" y="355" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">professor_id</text>

  <!-- Session -> Room -->
  <line x1="847" y1="225" x2="847" y2="423" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="883" y="355" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">room_id</text>
</svg>